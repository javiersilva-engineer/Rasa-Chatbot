# Server where the models are pulled from.
# https://rasa.com/docs/rasa-pro/production/model-storage#fetching-models-from-a-server

#models:
#  url: http://my-server.com/models/default_core@latest
#  wait_time_between_pulls:  10   # [optional](default: 100)

# Server which runs your custom actions.
# https://rasa.com/docs/rasa-pro/concepts/custom-actions

action_endpoint:
  actions_module: "actions"

# Tracker store which is used to store the conversations.
tracker_store:
  type: redis
  url: localhost
  port: 6379
  db: 0
  key_prefix: tracker

# Lock store - CRÍTICO para evitar cruces de respuestas
lock_store:
  type: redis
  url: localhost
  port: 6379
  db: 1
  key_prefix: lock

# Event broker which all conversation events should be streamed to.
# https://rasa.com/docs/rasa-pro/production/event-brokers

#event_broker:
#  url: localhost
#  username: username
#  password: password
#  queue: queue

# Allow rephrasing of responses using a Rasa-hosted model
nlg:
  type: rephrase
  rephrase_all: true
  llm:
    model_group: groq_llama
  summarize_history: False
  max_historical_turns: 10

model_groups:
  - id: groq_llama
    models:
      - provider: groq
        model: llama-3.3-70b-versatile
        timeout: 30
        num_retries: 3
        temperature: 0.0
        api_base: "https://api.groq.com/openai/v1"
        api_key: ${GROQ_API_KEY}

  - id: mistral_embeddings
    models:
      - provider: mistral
        model: mistral-embed
        api_key: ${MISTRAL_API_KEY}