# UTTER ABP LOUV ---------------------------------------------------------------

  utter_nombre_louv:
    - text: "El nombre de Louv viene de una antigua princesa marroquí de la cual todos estaban enamorados y trataban de conquistarla regalándole joyas preciosas. Por desgracia, ninguno de sus pretendientes consiguió conquistarla nunca, pues no existía joya que estuviese a la altura de su anillo soñado."
      metadata:
        rephrase: false

  utter_proyecto_louv:
    - text: "Louv es un proyecto creado por Patata Team para permitir a los usuarios diseñar su anillo soñado de manera fácil e intuitiva mediante un editor 3D. Cuando se creó Louv, se enfocó en el mercado del lujo medio, permitiendo a los usuarios crear el anillo que siempre quisieron a un precio asequible."
      metadata:
        rephrase: false

  utter_louv_real:
    - text: "Louv es un proyecto universitario. Como ABP que es, no es un proyecto real, no pertenece a una empresa como tal, solo sirve como proyecto académico."
      metadata:
        rephrase: false

  utter_idea_louv_abp:
    - text: "Louv fue el resultado detrás de un proceso de brainstorming, en la que todo el equipo Patata Team propuso distintas ideas y finalmente, tras consultar con el profesorado, se tomó la decisión
        de crear Louv, un editor de anillos 3D."
      metadata:
        rephrase: false

  utter_tiempo_desarrollo:
    - text: "Louv comenzó a crearse en septiembre de 2025, el tiempo exacto de su desarrollo depende de cuándo me preguntes, pero se estima que su desarrollo termine en mayo de 2026."
      metadata:
        rephrase: false

  utter_sugerir_cambio:
    - text: "Si deseas enviar tus sugerencias al equipo de desarrollo le recomiendo que se ponga en contacto con estos a través del correo louv.spain@gmail.com."
      metadata:
        rephrase: false

  utter_explicar_abp:
    - text: "Un ABP (Aprendizaje Basado en Proyectos) consiste en un enfoque pedagógico en el que los estudiantes adquieren conocimientos y habilidades al desarrollar de manera colaborativa y autónoma un proyecto real para resolver un problema o responder a una pregunta desafiante."
      metadata:
        rephrase: false

  utter_louv_unico:
    - text: "Louv es la única plataforma que ofrece un editor 3D de anillos tan detallado, trabajamos con materiales de alta calidad y no hacemos uso 
        de diamantes de sangre. Nos preocupamos porque nuestros clientes disfruten de la mayor calidad y de la proveniencia de nuestras gemas."
