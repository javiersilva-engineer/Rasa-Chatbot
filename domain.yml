          Just like gold has karats, platinum is classified by purity, such as 950, 900 or 850, indicating the percentage of platinum in the alloy.

  utter_macizo:
    - text: |
        Todos los materiales que usamos para fabricar los anillos que vendemos son macizos.
      translation:
