          You cannot make a size change. Once you receive your ring, you cannot make any modifications.









# 16. UTTERS SOBRE MATERIALES --------------------------------------------------------------------------------

  utter_explicacion_aleacion:
    - text: "Una aleación es una mezcla de dos o más elementos, donde al menos uno de ellos es un metal. En joyería, las aleaciones se utilizan para mejorar las propiedades del metal base, como su dureza, durabilidad y resistencia a la corrosión."
      translation:
        en: "An alloy is a mixture of two or more elements, where at least one of them is a metal. In jewelry, alloys are used to improve the properties of the base metal, such as its hardness, durability and resistance to corrosion."

  utter_oro_18_14:
    - text: |
        El oro de 18k tiene más oro puro y se ve más intenso y cálido, mientras que el de 14k contiene más aleaciones, es más duro y su color es ligeramente más pálido.
      translation:
        en: |
          18k gold has more pure gold and looks more intense and warm, while 14k gold contains more alloys, is harder and its color is slightly paler.

  utter_clases_platino:
    - text: |
        Igual que el oro tiene quilates, el platino se clasifica por pureza, como 950, 900 o 850, indicando el porcentaje de platino en la aleación.
      translation:
