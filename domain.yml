# 13. UTTERS DATOS SOBRE GEMAS ---------------------------------------------------------------

  utter_escala_de_mohs:
    - text: "La escala de Mohs es una escala de dureza relativa que clasifica los minerales según su capacidad para resistir la abrasión. Va del 1 al 10, siendo el talco el más blando (1) y el diamante el más duro (10)."
      translation:
        en: "The Mohs scale is a relative hardness scale that classifies minerals according to their ability to resist abrasion. It ranges from 1 to 10, with talc being the softest (1) and diamond being the hardest (10)."

  utter_gemas_certificadas:
    - text: "Las gemas certificadas son aquellas que han sido evaluadas por laboratorios gemológicos reconocidos, los cuales verifican su autenticidad, calidad y características. En Louv, nos aseguramos de que todas nuestras gemas sean certificadas para garantizar su valor y calidad."
      translation:
        en: "Certified gems are those that have been evaluated by recognized gemological laboratories, which verify their authenticity, quality and characteristics. At Louv, we ensure that all our gems are certified to guarantee their value and quality."

  utter_diamantes_de_sangre_y_kimberley:
    - text: "Para saber el origen de nuestras gemas y evitar los diamantes de sangre, en Louv se hace uso del Sistema de Certificación Kimberley,
            de esta manera, nos aseguramos de que nuestras gemas no se extraen en zonas de conflicto, ni se financian guerras ni violan los derechos humanos.
            Pues el Sistema de Certificación Kimberley, es un proceso internacional establecido para prevenir el comercio de diamantes de sangre. Este sistema certifica que los diamantes han sido extraídos y comercializados de manera ética y legal, sin financiar conflictos armados."
      translation:
        en: "To know the origin of our gems and avoid conflict diamonds, Louv uses the Kimberley Certification System,
            in this way, we ensure that our gems are not extracted in conflict zones, nor do they finance wars or violate human rights.
            The Kimberley Certification System is an international process established to prevent the trade of conflict diamonds. This system certifies that diamonds have been extracted and traded in an ethical and legal manner, without financing armed conflicts."

  utter_certificacion_gia:
    - text: |
        Un certificado GIA es un informe científico y objetivo emitido por el Instituto Gemológico de América (GIA) que evalúa la calidad y autenticidad de un diamante basándose en las 4C: Color, Claridad, Corte y Quilates.
        Si desea saber más sobre los certificados GIA, le recomiendo visitar su página oficial: https://www.gia.edu/
      translation:
        en: |
          A GIA certificate is a scientific and objective report issued by the Gemological Institute of America (GIA) that evaluates the quality and authenticity of a diamond based on the 4Cs: Color, Clarity, Cut and Carat.
          If you would like to know more about GIA certificates, I recommend visiting their official website: https://www.gia.edu/

  utter_diferencia_ct_kt:
    - text: "La diferencia es que ct (quilate) se usa para medir el peso de las piedras preciosas (un quilate métrico equivale a 0.2 gramos), mientras que kt (quilate) se refiere a la pureza del oro (indica la proporción de oro puro en una aleación de 24 partes)."
      translation:
        en: "The difference is that ct (carat) is used to measure the weight of precious stones (one metric carat equals 0.2 grams), while kt (karat) refers to the purity of gold (indicates the proportion of pure gold in an alloy of 24 parts)."

  utter_significado_4c:
    - text: "Las 4C son los cuatro criterios principales para evaluar la calidad de un diamante: Color (la ausencia de color), Claridad (la presencia de inclusiones), Corte (la calidad del tallado) y Quilates (el peso del diamante). Estos factores determinan el valor y la belleza de un diamante."
      translation:
        en: "The 4Cs are the four main criteria for evaluating the quality of a diamond: Color (absence of color), Clarity (presence of inclusions), Cut (quality of the cut) and Carat (weight of the diamond). These factors determine the value and beauty of a diamond."

  utter_gema_de_laboratorio_y_distinguir_gema_natural_sintetica:
    - text: "Una gema de laboratorio es una gema cultivada en un laboratorio que imita el proceso de formación natural, pero en un entorno controlado y acelerado. Son mucho más baratas que las gemas naturales con precios hasta un 30-70% más bajos.
            A simple vista no es posible distinguir una gema natural de una de laboratorio, ya que tienen la misma composición química y propiedades físicas. Sin embargo, un gemólogo certificado con equipo especializado, puede identificar diferencias en las inclusiones y patrones de crecimiento."
      translation:
        en: "A lab-created gem is a gemstone cultivated in a laboratory that mimics the natural formation process, but in a controlled and accelerated environment. They are much cheaper than natural gems with prices up to 30-70% lower.
            It is not possible to distinguish a natural gem from a lab-created one with the naked eye, as they have the same chemical composition and physical properties. However, a certified gemologist with specialized equipment can identify differences in inclusions and growth patterns."

  utter_gemas_caras:
    - text: "Es cierto que existen gemas más económicas en el mercado, pero no de la calidad que se ofrecen en Louv. Nuestras gemas tienen una calidad superior en color, pureza y talla, están certificadas y seleccionadas individualmente. Esto garantiza más brillo, durabilidad y valor real a largo plazo."
      translation:
        en: "It is true that there are more economical gems on the market, but not with the quality offered at Louv. Our gems have superior quality in color, purity and cut, are certified and individually selected. This guarantees more brilliance, durability and real value in the long term."

  utter_quilates_tamano:
    - text: "El quilate mide peso, no tamaño. Como cada gema tiene distinta densidad y talla, dos piedras de 1 ct pueden verse de tamaños diferentes."
      translation:
        en: "Carat measures weight, not size. Since each gem has different density and cut, two 1 ct stones can appear different sizes."

  utter_calcular_precio:
    - text: "El precio de una gema se calcula según el valor actual del mercado, basándonos en reportes profesionales como Rapaport, que marcan las tarifas internacionales para las gemas que ofrecemos."
      translation:
        en: "The price of a gem is calculated according to the current market value, based on professional reports such as Rapaport, which set the international prices for the gems we offer."

  utter_versiones_artificiales:
    - text: "Algunas gemas tienen versiones artificiales o sintéticas, pero otras, por su rareza o estructura, solo se encuentran de forma natural. Por ejemplo, diamantes y zafiros tienen versiones sintéticas, pero gemas como la alejandrita natural son muy difíciles de reproducir artificialmente."
      translation:
        en: "Some gems have artificial or synthetic versions, but others, due to their rarity or structure, are only found in nature. For example, diamonds and sapphires have synthetic versions, but gems like natural alexandrite are very difficult to reproduce artificially."

  utter_tipos_piedras:
    - text: |
        Piedra preciosa: rara, valiosa y duradera (ej. diamante, rubí, zafiro).
        
        Piedra semipreciosa: menos rara y más económica (ej. amatista, citrino).
        
        Gema de nacimiento: piedra asociada a un mes concreto, puede ser preciosa o semipreciosa."
      translation:
        en: |
          Precious stone: rare, valuable and durable (e.g. diamond, ruby, sapphire).
          
          Semi-precious stone: less rare and more economical (e.g. amethyst, citrine).
          
          Birthstone: stone associated with a specific month, can be precious or semi-precious."









