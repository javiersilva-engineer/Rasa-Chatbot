# 19. UTTERS SOBRE TERMINOLOGIA ESPECIFICA ---------------------------------------------------------------------

  utter_anillo_sortija_alianza:
    - text: |
        Esta es la definición de un anillo, una sortija y una alianza:
        
        Anillo: término general para cualquier joya circular que se lleva en el dedo.
        
        Sortija: tipo de anillo más elaborado o decorativo, normalmente con una o varias gemas.
        
        Alianza: anillo sencillo y liso, tradicionalmente usado como símbolo de compromiso o matrimonio.
      translation:
        en: |
          This is the definition of a ring, a dress ring, and a band:

          Ring: a general term for any circular piece of jewelry worn on the finger.

          Dress ring: a more elaborate or decorative type of ring, usually featuring one or more gemstones.

          Band: a simple, plain ring, traditionally worn as a symbol of engagement or marriage.

  utter_montura_cabeza_corona:
    - text: |
        La montura, cabeza o corona de un anillo es la parte superior donde se sujeta y exhibe la gema, diseñada para protegerla y realzar su brillo.
        Es importante destacar que, el término corona, también puede hacer referencia a la parte superior de una gema, situada por encima del filetín, formada por las facetas que reflejan la luz y aportan brillo.
      translation:
        en: |
          The setting, head or crown of a ring is the top part where the gemstone is held and displayed, designed to protect it and enhance its brightness.
          It is important to note that the term crown can also refer to the top part of a gemstone, located above the girdle, formed by the facets that reflect light and provide brilliance.

  utter_aro_cuerpo:
    - text: |
        El aro o cuerpo es la parte circular del anillo que rodea el dedo y sostiene la montura, aportando estructura y comodidad.
      translation:
        en: |
          The shank or body is the circular part of the ring that goes around the finger and holds the setting, providing structure and comfort.

  utter_contraste:
    - text: |
        El contraste es el marcado oficial que certifica la pureza del metal precioso (oro, plata o platino), garantizando su autenticidad conforme a la normativa.
      translation:
        en: |
          Hallmark is the official marking that certifies the purity of precious metal (gold, silver or platinum), guaranteeing its authenticity according to regulations.

  utter_anillos_sin_contraste:
    - text: |
        Un anillo puede recibirse sin contraste si no ha sido contrastado oficialmente, aunque en Louv se le garantiza que todos los anillos están contrastados. 
        Las gemas, en cambio, no llevan contraste; su autenticidad y calidad se acreditan mediante certificados gemológicos, no con marcas físicas.
      translation:
        en: |
          A ring can be received without a hallmark if it has not been officially hallmarked, although at Louv we guarantee that all rings are hallmarked.
          Gemstones, on the other hand, do not have hallmarks; their authenticity and quality are certified through gemological certificates, not with physical marks.

  utter_engarce_engaste:
    - text: |
        El engarce es la técnica mediante la cual la gema se fija a la montura del anillo, asegurando su sujeción y definiendo su estilo y visibilidad.
        En cambio, el engaste es el sistema o diseño con el que la gema queda sujeta al anillo, determinando cómo se sostiene, se protege y se muestra la piedra.
      translation:
        en: |
          Setting is the technique by which the gemstone is fixed to the ring's setting, ensuring its secure attachment and defining its style and visibility.
          On the other hand, the mounting is the system or design with which the gemstone is fastened to the ring, determining how the stone is held, protected and displayed.

  utter_puente:
    - text: |
        El puente es la parte del anillo que une la montura con el aro, aportando estabilidad estructural y elevando la cabeza donde se engasta la gema.
      translation:
        en: |
          The bridge is the part of the ring that connects the setting to the shank, providing structural stability and raising the head where the gemstone is mounted.

  utter_hombro:
    - text: |
        El hombro es la zona del anillo situada entre el aro y la montura, que acompaña y realza la cabeza, aportando transición estética y refuerzo estructural.
      translation:
        en: |
          The shoulder is the area of the ring located between the shank and the setting, which accompanies and enhances the head, providing aesthetic transition and structural reinforcement.

  utter_apoyo_canasta:
    - text: |
        El apoyo o canasta es la estructura que sostiene la gema desde abajo en la montura, asegurando su fijación y permitiendo que la luz atraviese la piedra para realzar su brillo.
      translation:
        en: |
          The basket or cup is the structure that holds the gemstone from below in the setting, ensuring its secure placement and allowing light to pass through the stone to enhance its brilliance.

  utter_galeria:
    - text: |
        La galería es el espacio abierto que queda debajo de la gema en la montura del anillo, permitiendo que la luz entre desde abajo y realce el brillo de la piedra.
      translation:
        en: |
          The gallery is the open space under the gemstone in the ring setting, allowing light to enter from below and enhance the brilliance of the stone.

  utter_piedra_central_lateral_decorativa:
    - text: |
        Aquí le explico lo que es una piedra central, una piedra lateral y una piedra decorativa:
        
        Piedra central: la gema principal del anillo, foco de atención.
        
        Piedras laterales o complementarias: gemas más pequeñas que acompañan y realzan la piedra central.
        
        Piedras decorativas o de acento: pequeñas piedras adicionales que aportan brillo o detalle, sin ser protagonistas.
      translation:
        en: |
          Here I explain what a center stone, a side stone, and an accent stone are:

          Center stone: the main gemstone of the ring, the focal point.

          Side stones or complementary stones: smaller gemstones that accompany and enhance the center stone.

          Decorative or accent stones: small additional stones that add sparkle or detail without being the main focus.

  utter_cana:
    - text: |
        La caña es la parte del aro del anillo que se estrecha y se eleva para sostener la montura o cabeza de la gema, aportando soporte y forma al conjunto.
      translation:
        en: |
          The bridge shank is the part of the ring that tapers and rises to support the setting or head of the gemstone, providing support and form to the whole.

  utter_perfil:
    - text: |
        El perfil es la forma que tiene el aro del anillo visto de lado. Los tipos más comunes son:
        
        Redondo: aro completamente curvado, cómodo y clásico.
        
        Plano: aro con superficie plana, moderno y elegante.
        
        Cuadrado o biselado: bordes angulares, estilizado y contemporáneo.
        
        Doble o combinado: mezcla de formas para diseño especial.
      translation:
        en: |
          The profile is the shape of the ring shank when viewed from the side. The most common types are:
          
          Round: completely curved shank, comfortable and classic.
          
          Flat: shank with a flat surface, modern and elegant.
          
          Square or beveled: angular edges, streamlined and contemporary.
          
          Double or combined: mixture of forms for special design.

  utter_halo:
    - text: |
        El halo es un conjunto de pequeñas piedras que rodean a la gema central de un anillo, realzando su tamaño, brillo y presencia visual.
      translation:
        en: |
          A halo is a set of small stones surrounding the center gemstone of a ring, enhancing its size, brilliance and visual presence.

  utter_filetin:
    - text: |
        El filetín es el bisel o borde que separa la corona de la gema del resto de la piedra, marcando la transición entre la parte superior (corona) y la inferior (pabellón) y ayudando a protegerla.
      translation:
        en: |
          The girdle is the beveled edge that separates the crown of the gemstone from the rest of the stone, marking the transition between the upper part (crown) and lower part (pavilion) and helping to protect it.

  utter_culata:
    - text: |
        En joyería, la culata es la parte inferior del pabellón de la gema, justo en el extremo opuesto a la corona, que suele terminar en un punto o facetado y ayuda a reflejar la luz dentro de la piedra.
      translation:
        en: |
          In jewelry, the base or back is the lower part of the gemstone's pavilion, just at the opposite end from the crown, which usually ends in a point or faceted and helps reflect light inside the stone.

  utter_culet:
    - text: |
        El culet es la pequeña punta o faceta en la base del pabellón de una gema, diseñada para proteger la piedra de golpes y, en algunas tallas, permitir mejor paso de la luz.
      translation:
        en: |
          The culet is the small point or facet at the bottom of a gemstone's pavilion, designed to protect the stone from impact and, in some cuts, allow better light passage.

  utter_tabla:
    - text: |
        La tabla es la faceta superior y más grande de una gema, situada en la corona, por donde entra la luz principal y se refleja para dar brillo a la piedra.
      translation:
        en: |
          The table is the top and largest facet of a gemstone, located in the crown, where the main light enters and reflects to give brilliance to the stone.

  utter_faceta:
    - text: |
        Una faceta es cada una de las superficies planas pulidas de una gema que reflejan la luz. Se clasifican en:
        
        Facetas de corona: en la parte superior de la gema.
        
        Facetas de pabellón: en la parte inferior de la gema.
        
        Facetas de cintura o filetín: alrededor del borde que separa corona y pabellón.
      translation:
        en: |
          A facet is each one of the polished flat surfaces of a gemstone that reflects light. They are classified as:
          
          Crown facets: on the top part of the gemstone.
          
          Pavilion facets: on the bottom part of the gemstone.
          
          Girdle or bezel facets: around the edge separating the crown and pavilion.

  utter_pabellon:
    - text: |
        El pabellón es la parte inferior de una gema, situada debajo del filetín, formada por facetas que dirigen la luz reflejada hacia la corona para potenciar el brillo de la piedra.
      translation:
        en: |
          The pavilion is the lower part of a gemstone, located below the girdle, formed by facets that direct reflected light towards the crown to enhance the brilliance of the stone.

  utter_ratio:
    - text: |
        El ratio es la proporción entre la altura y el diámetro de una gema, especialmente en diamantes, que influye en su brillo y apariencia visual.
        El ratio ideal varía según el tipo de gema y su talla. Cada piedra tiene densidad, refracción y estilo de talla distintos, por lo que un ratio que funciona para un diamante puede no ser óptimo para un zafiro o una esmeralda.
      translation:
        en: |
          The ratio is the proportion between the height and diameter of a gemstone, especially in diamonds, which affects its brilliance and visual appearance.
          The ideal ratio varies depending on the type of gemstone and its cut. Each stone has different density, refraction and cutting style, so a ratio that works for a diamond may not be optimal for a sapphire or an emerald.

  utter_diametro:
    - text: |
        El diámetro es la medida de un extremo al otro de la gema o anillo, pasando por el centro.
        
        En gemas: se mide de un borde al opuesto, generalmente en milímetros.      
        
        En anillos: se mide el diámetro interior del aro para determinar la talla.
      translation:
        en: |
          The diameter is the measurement from one end to the other of a gemstone or ring, passing through the center.
          
          In gemstones: it is measured from one edge to the opposite, generally in millimeters.
          
          In rings: the inner diameter of the shank is measured to determine the size.










# 20. UTTERS SOBRE BODAS -------------------------------------------------------------------------------------

  utter_precio_anillo_compromiso:
    - text: |
        Una guía clásica sugiere destinar entre 2 y 3 meses de salario en un anillo de compromiso. Lo más importante es elegir un anillo que se ajuste a su presupuesto y que represente el compromiso de forma significativa, sin comprometer su estabilidad financiera.
      translation:
        en: |
          A classic guideline suggests setting aside between 2 and 3 months of salary for an engagement ring. The most important thing is to choose a ring that fits your budget and represents the commitment in a meaningful way, without compromising your financial stability.

  utter_tamano_calidad_diamante:
    - text: |
        Para un anillo de compromiso, la calidad del diamante suele ser más importante que el tamaño. Un diamante de mayor claridad, buen color y excelente talla brillará más y será más duradero, mientras que un diamante más grande pero de menor calidad puede verse opaco y menos atractivo.
      translation:
        en: |
          For an engagement ring, the quality of the diamond is usually more important than size. A diamond with higher clarity, good color and excellent cut will shine more and be more durable, while a larger diamond of lower quality may appear opaque and less attractive.

  utter_diamante_anillo_compromiso:
    - text: | 
        Se regalan diamantes porque son muy duros y duraderos, simbolizando amor eterno. Además, la tradición los ha convertido en el estándar para anillos de compromiso. Pero es posible usar gemas distintas para anillos de compromiso, como zafiros, esmeraldas o rubíes.
      translation:
        en: |
          Diamonds are given as gifts because they are very hard and durable, symbolizing eternal love. In addition, tradition has made them the standard for engagement rings. But it's possible to use different gems for engagement rings, such as sapphires, emeralds or rubies.
  
  utter_diseno_anillo_compromiso:
    - text: | 
        El diseño clásico que nunca falla es un anillo de oro blanco o platino, con un diamante como gema central, engastado en solitario con cuatro o seis garras, que realza el brillo de la piedra y mantiene la elegancia atemporal.
      translation:
        en: |
          The classic design that never fails is a white gold or platinum ring, with a diamond as the center gemstone, mounted in a solitaire setting with four or six prongs, which enhances the brilliance of the stone and maintains timeless elegance.

  utter_cuidar_anillo:
    - text: | 
        La mejor forma de cuidar su anillo de compromiso cuando no lo use es guardarlo en un estuche o caja acolchada, separado de otras joyas para evitar rayaduras. Evite ambientes húmedos o exposición a productos químicos, y límpielo ocasionalmente con un paño suave.
      translation:
        en: |
          The best way to care for your engagement ring when not wearing it is to store it in a padded case or box, separate from other jewelry to avoid scratches. Avoid humid environments or exposure to chemicals, and clean it occasionally with a soft cloth.

  utter_anillo_diario:
    - text: |
        Llevar el anillo de compromiso todos los días es común para simbolizar el compromiso. Eso sí, conviene retirarlo al hacer tareas que puedan dañarlo para mantenerlo en perfecto estado.
      translation:
        en: |
          Wearing the engagement ring every day is common to symbolize commitment. That said, it's best to remove it when doing tasks that could damage it to keep it in perfect condition.











