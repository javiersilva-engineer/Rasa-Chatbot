  utter_out_of_scope:
    - text: "Lo siento, no he podido entenderte. ¿Podrías reformular tu pregunta?"
  
  utter_cannot_handle:
    - text: "Lo siento, no puedo ayudarte con eso en este momento."
  
  utter_ask_rephrase:
    - text: "No estoy seguro de haber entendido. ¿Podrías reformular tu pregunta?"
  
  utter_default:
    - text: "Lo siento, no he entendido eso."

