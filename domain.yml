    - text: "Un ABP (Aprendizaje Basado en Proyectos) consiste en un enfoque pedagógico en el que los estudiantes adquieren conocimientos y habilidades al desarrollar de manera colaborativa y autónoma un proyecto real para resolver un problema o responder a una pregunta desafiante."
