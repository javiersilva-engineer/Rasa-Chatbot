  utter_cambiar_talla_anillo:
    - text: |
        Para cambiar la talla del anillo debe acceder al desplegable "Base del anillo" que se encuentra a la izquierda del editor
        e introducir la talla deseada. Es importante mencionarle, que este cambio no realizará ningún cambió en la visualización del
        diseño 3D. Además, dependiendo del modelo que seleccione quizá no será posible el cambio de talla.
      metadata:
        rephrase: false

  utter_saber_talla_anillo:
    - text: |
        Para saber una talla de anillo es muy sencillo, tan solo debe medir la circunferencia de su dedo. Si no posee herramientas para hacerlo le recomiendo lo siguiente:
        Corte una tira de papel pequeña, envuélvalo alrededor de su dedo y haga una marca donde el papel se solape, así podrá saberlo.
        Por ejemplo: si la circunferencia mide 52 mm, su talla es la 12. Si quiere, dígame la medida que ha obtenido y le digo su talla. 
      metadata:
        rephrase: false

  utter_devolver_anillo_talla:
    - text: |
        Lamento decirle que tan solo podrá devolver un producto en caso de que posea un defecto de fábrica. Al ser una pieza personalizada,
