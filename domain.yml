  utter_devolucion_anillo:
    - text: "Si el producto que desea dovelver no estuviese en condiciones óptimas y/o presentase algún defecto, podrá ser devuelto en el plazo máximo
       de 14 días naturales desde la recepción del pedido, procediendo a su sustitución. Si desea saber más sobre las condiciones de las devoluciones
       le recomiendo consultar nuestros Términos y Condiciones. En caso de querer realizar una devolución y esta cumpla las condiciones para que pueda realizarse
       le recomiendo que se ponga en contacto con el departamento de devoluciones a través de louv.spain@gmail.com"
