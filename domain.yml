  utter_grabados:
    - text: |
        No es posible realizar grabados en los anillos.
      translation:
        en: |
          It is not possible to perform engravings on the rings.

  utter_opina:
    - text: |
        Es un anillo magnífico, tiene un don para el diseño de joyas.
      translation:
        en: |
          It is a magnificent ring, you have a talent for jewelry design.










