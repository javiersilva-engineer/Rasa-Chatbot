  utter_gemas_caras:
    - text: "Es cierto que existen gemas más económicas en el mercado, pero no de la calidad que se ofrecen en Louv. Nuestras gemas tienen una calidad superior en color, pureza y talla, están certificadas y seleccionadas individualmente. Esto garantiza más brillo, durabilidad y valor real a largo plazo."
      metadata:
        rephrase: false

  utter_quilates_tamano:
    - text: "El quilate mide peso, no tamaño. Como cada gema tiene distinta densidad y talla, dos piedras de 1 ct pueden verse de tamaños diferentes."
      metadata:
        rephrase: false

  utter_calcular_precio:
    - text: "El precio de una gema se calcula según el valor actual del mercado, basándonos en reportes profesionales como Rapaport, que marcan las tarifas internacionales para las gemas que ofrecemos."
      metadata:
        rephrase: false

  utter_versiones_artificiales:
    - text: "Algunas gemas tienen versiones artificiales o sintéticas, pero otras, por su rareza o estructura, solo se encuentran de forma natural. Por ejemplo, diamantes y zafiros tienen versiones sintéticas, pero gemas como el alexandrita natural son muy difíciles de reproducir artificialmente."
      metadata:
        rephrase: false

  utter_tipos_piedras:
    - text: |
        Piedra preciosa: rara, valiosa y duradera (ej. diamante, rubí, zafiro).
        Piedra semipreciosa: menos rara y más económica (ej. amatista, citrino).
        Gema de nacimiento: piedra asociada a un mes concreto, puede ser preciosa o semipreciosa."
      metadata:
        rephrase: false




