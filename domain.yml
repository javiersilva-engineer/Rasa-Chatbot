# 8. UTTERS SOBRE LOUV ---------------------------------------------------------------

  utter_proyecto_louv_abp:
    - text: "Louv es un proyecto ABP (Aprendizaje Basado en Proyectos) creado por Patata Team. Al ser un ABP no es un proyecto real y surgió como resultado detrás de un proceso de brainstorming,
            en el que todos los integrantes apòrtaron su sideas y, tras ello, se decidió crear Louv, para permitir a los usuarios diseñar su anillo soñado de manera fácil e intuitiva mediante un editor 3D."
      translation:
        en: "Louv is a PBL (Project-Based Learning) project created by Patata Team. Being a PBL it is not a real project and was the result of a brainstorming process,
            in which all team members contributed their ideas and then decided to create Louv, to allow users to design their dream ring easily and intuitively through a 3D editor."

  utter_nombre_louv:
    - text: "El nombre de Louv viene de una antigua princesa marroquí de la cual todos estaban enamorados y trataban de conquistarla regalándole joyas preciosas. Por desgracia, ninguno de sus pretendientes consiguió conquistarla nunca, pues no existía joya que estuviese a la altura de su anillo soñado."
      translation:
        en: "The name Louv comes from an ancient Moroccan princess of whom everyone was in love and tried to conquer her by giving her precious jewels. Unfortunately, none of her suitors ever managed to win her, for there was no jewel worthy of her dream ring."

  utter_tiempo_desarrollo:
    - text: "Louv comenzó a crearse en septiembre de 2025, el tiempo exacto de su desarrollo depende de cuándo me preguntes, pero se estima que su desarrollo termine en mayo de 2026."
      translation:
        en: "Louv began to be created in September 2025, the exact time of its development depends on when you ask me, but it is estimated that its development will end in May 2026."

  utter_explicar_abp:
    - text: "Un ABP (Aprendizaje Basado en Proyectos) consiste en un enfoque pedagógico en el que los estudiantes adquieren conocimientos y habilidades al desarrollar de manera colaborativa y autónoma un proyecto real para resolver un problema o responder a una pregunta desafiante."
      translation:
        en: "A PBL (Project-Based Learning) consists of a pedagogical approach in which students acquire knowledge and skills by collaboratively and autonomously developing a real project to solve a problem or answer a challenging question."

  utter_terminos_politica_cookies:
    - text: |
        Puede consultar nuestra Política de Privacidad de Datos desde el footer de la página web o desde los siguientes enlaces:
        
        Política de privacidad: https://louv.ovh/politica-de-privacidad
        
        Términos y condiciones: https://louv.ovh/terminos-y-condiciones
        
        Cookies: https://louv.ovh/politica-de-cookies
      translation:
        en: |
          You can review our Data Privacy Policy from the footer of the website or from the following links:
          
          Privacy Policy: https://louv.ovh/politica-de-privacidad
          
          Terms and Conditions: https://louv.ovh/terminos-y-condiciones
          
          Cookies: https://louv.ovh/politica-de-cookies

  utter_devolucion_anillo:
    - text: "Los productos personalizados como los anillos que ofrecemos no se pueden devolver, pero si el producto que desea devolver no estuviese en condiciones óptimas y/o presentase algún defecto, podrá ser devuelto en el plazo máximo
       de 14 días naturales desde la recepción del pedido, procediendo a su sustitución. Si desea saber más sobre las condiciones de las devoluciones
       le recomiendo consultar nuestros Términos y Condiciones. En caso de querer realizar una devolución y esta cumpla las condiciones para que pueda realizarse
       le recomiendo que se ponga en contacto con el departamento de devoluciones a través de louv.spain@gmail.com"
      translation:
        en: "Personalized products like the rings we offer cannot be returned, but if the product you wish to return is not in optimal condition and/or has a defect, it can be returned within a maximum period
          of 14 calendar days from receipt of the order, proceeding to its replacement. If you want to know more about the conditions for returns
          I recommend consulting our Terms and Conditions. If you want to make a return and it meets the conditions for it to be made
          I recommend that you contact the returns department via louv.spain@gmail.com"






