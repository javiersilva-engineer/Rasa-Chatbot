          I'm sorry to tell you that you can only return a product if it has a manufacturing defect. Since it is a customized piece, our company policy does not allow us to accept returns for the reason you mentioned.

  utter_duda_entre_tallas:
    - text: |
        Si usted está dudando entre dos tallas, le aconsejo que elija la más grande, siempre es mejor que el anillo quede
        un poco holgado a que le apriete el dedo.
      translation:
        en: |
          If you are unsure between two sizes, I recommend choosing the larger one. It is always better for the ring to be slightly loose than to be tight on your finger.

  utter_talla_dedo_distinta:
    - text: |
        Cada dedo puede tener una talla distinta, en función de lo que mida la circunferencia del dedo, usará una talla u otra.
      translation:
        en: |
          Each finger can have a different size, depending on the circumference of the finger, you will use one size or another.

  utter_temperatura_talla:
    - text: |
        La temperatura puede afectar al grosor de tu dedo y puede cambiar la talla. Por eso es muy importante medirse el dedo al final del día, cuano se está tranquilo,
        nunca en momentos de frío o calor, como al terminar de hacer ejercicio.
      translation:
        en: |
          Temperature can affect the thickness of your finger and can change the size. That's why it's very important to measure your finger at the end of the day, when you're calm, never during cold or hot moments, like after exercising.

  utter_modificar_talla_posteriori:
    - text: |
        No se puede hacer un cambio de talla. Una vez recibe su anillo no puede hacer modificaciones.
      translation:
