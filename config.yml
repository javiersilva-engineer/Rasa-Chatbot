recipe: default.v1
language: es
additional_languages:
  - en
assistant_id: similar-flow
pipeline:
  - name: SearchReadyLLMCommandGenerator
    minimize_num_calls: true
    llm:
      model_group: groq_llama
    flow_retrieval:
      active: true
      embeddings:
        model_group: mistral_embeddings
      num_flows: 10
      turns_to_embed: 1
      should_embed_slots: false

policies:
- name: FlowPolicy