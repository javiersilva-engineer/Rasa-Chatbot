flows:
  # Sobrescribe pattern_search para que no genere respuesta ---------------------------------------------------------------
  pattern_search:
    description: |
      Patrón de búsqueda desactivado
    name: pattern search
    steps:
      - id: "0"
        action: action_listen
        next: END

  # Sobrescribe pattern_completed para que no genere respuesta ---------------------------------------------------------------
  pattern_completed:
    description: |
      Patrón que se ejecuta después de completar un flujo
    name: pattern completed
    steps:
      - id: "0"
        action: action_listen
        next: END





# FLOWS SALUDOS Y DESPEDIDAS ---------------------------------------------------------------

  saludar:
    description: |
      El usuario saluda al asistente con expresiones como "hola", "buenos días", 
      "buenas tardes", "qué tal"
    steps:
      - action: utter_saludo

  despedirse:
    description: |
      El usuario se despide del asistente con expresiones como "adiós", "hasta luego", 
      "nos vemos", "chao"
    steps:
      - action: utter_despedida





# FLOWS SOBRE LUNA ---------------------------------------------------------------

  preguntar_nombre:
    description: |
      El usuario pregunta por el nombre del asistente, como "¿Cómo te llamas?", 
      "¿Cuál es tu nombre?", "¿Quién eres?"
    steps:
      - action: utter_nombre

  preguntar_nacimiento:
    description: |
      El usuario pregunta cuándo fue creado el asistente, como "¿Cuándo naciste?", 
      "¿Cuándo te crearon?", "¿Cuál es tu fecha de nacimiento?"
    steps:
      - action: utter_nacimiento

  preguntar_padres:
    description: |
      El usuario pregunta quién creó al asistente, como "¿Quién te creó?", 
      "¿Quiénes son tus padres?", "¿Quién te hizo?"
    steps:
      - action: utter_padres

  preguntar_trabajo:
    description: |
      El usuario pregunta sobre el trabajo o función del asistente, como 
      "¿Qué haces?", "¿Cuál es tu trabajo?", "¿Para qué sirves?"
    steps:
      - action: utter_trabajo
  
  hobbies_luna:
    description: |
      El usuario pregunta sobre los hobbies o intereses del asistente, como 
      "¿Cuáles son tus hobbies?", "¿Qué te gusta hacer?", "¿Tienes algún pasatiempo?"
    steps:
      - action: utter_hobbies

  talla_anillo_luna:
    description: |
      El usuario pregunta sobre la talla de anillo del asistente, como 
      "¿Cuál es tu talla de anillo?", "¿Qué talla de anillo usas?", 
      "¿Tienes una talla de anillo favorita?"
    steps:
      - action: utter_talla_anillo  





