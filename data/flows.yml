flows:
  tell_bot_name:
    description: Tell the user that the bot's name is Luna when asked about the bot's name
    steps:
      - action: utter_bot_name
      
  transfer_money:
    description: Help users send money to friends and family.
    steps:
      - collect: recipient
      - collect: amount
        description: the number of US dollars to send
      - action: utter_transfer_complete