# FLOWS SOBRE HALAGOS Y ATAQUES ---------------------------------------------------------------

  halagar_luna:
    description: |
      El usuario hace un halago al asistente con frases como "Eres muy inteligente", 
      "Me encanta hablar contigo", "Eres muy amable"
    steps:
      - action: utter_halago

  atacar_luna:
    description: |
      El usuario hace un ataque o comentario negativo al asistente con frases como 
      "Eres tonto", "No me gusta hablar contigo", "Eres aburrido"
    steps:
      - action: utter_ataque

  diamantes_de_sangre:
    description: |
      El usuario pregunta ataca al chatbot por comerciar con diamantes de sangre,
      con frases como "¿Por qué vendes diamantes de sangre?", "¿No te importa la gente que sufre por los diamantes?",
      "Los diamantes de sangre son horribles"
    steps:
