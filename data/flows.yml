flows:
  # Sobrescribe pattern_search para que no genere respuesta
  pattern_search:
    description: |
      Patrón de búsqueda desactivado
    name: pattern search
    steps:
      - id: "0"
        action: action_listen
        next: END

  # Sobrescribe pattern_completed para que no genere respuesta
  pattern_completed:
    description: |
      Patrón que se ejecuta después de completar un flujo
    name: pattern completed
    steps:
      - id: "0"
        action: action_listen
        next: END



  #FLOWS SOBRE LUNA

  preguntar_nombre:
    description: |
      El usuario pregunta por el nombre del asistente, como "¿Cómo te llamas?", 
      "¿Cuál es tu nombre?", "¿Quién eres?"
    steps:
      - action: utter_nombre

  saludar:
    description: |
      El usuario saluda al asistente con expresiones como "hola", "buenos días", 
      "buenas tardes", "qué tal"
    steps:
      - action: utter_saludo

  preguntar_nacimiento:
    description: |
      El usuario pregunta cuándo fue creado el asistente, como "¿Cuándo naciste?", 
      "¿Cuándo te crearon?", "¿Cuál es tu fecha de nacimiento?"
    steps:
      - action: utter_nacimiento

  preguntar_padres:
    description: |
      El usuario pregunta quién creó al asistente, como "¿Quién te creó?", 
      "¿Quiénes son tus padres?", "¿Quién te hizo?"
    steps:
      - action: utter_padres

  preguntar_trabajo:
    description: |
      El usuario pregunta sobre el trabajo o función del asistente, como 
      "¿Qué haces?", "¿Cuál es tu trabajo?", "¿Para qué sirves?"
    steps:
      - action: utter_trabajo



  # FLOWS SOBRE ESTADO ANIMO USUARIO

  usuario_aburrido:
    description: |
      El usuario expresa que está aburrido con frases como "estoy aburrido", 
      "me aburro", "qué aburrimiento"
    steps:
      - action: utter_aburrido

  usuario_feliz:
    description: |
      El usuario expresa felicidad con frases como "estoy feliz", "estoy contento", 
      "qué alegría"
    steps:
      - action: utter_feliz

  usuario_triste:
    description: |
      El usuario expresa tristeza con frases como "estoy triste", "me siento mal", 
      "estoy deprimido"
    steps:
      - action: utter_triste

  usuario_enfadado:
    description: |
      El usuario expresa enfado con frases como "estoy enfadado", "estoy molesto", 
      "me enoja"
    steps:
      - action: utter_enfadado



  # FLOWS SOBRE PATATA TEAM Y LOUV

  preguntar_equipo:
    description: |
      El usuario pregunta sobre el equipo Patata Team, como "¿Quién es Patata Team?", 
      "¿Quiénes forman el equipo?"
    steps:
      - action: utter_equipo

  preguntar_nombre_patata:
    description: |
      El usuario pregunta por qué se llama Patata Team, como "¿Por qué Patata Team?", 
      "¿De dónde viene el nombre?"
    steps:
      - action: utter_patata

  preguntar_nombre_louv:
    description: |
      El usuario pregunta sobre el nombre Louv, como "¿Por qué se llama Louv?", 
      "¿Qué significa Louv?"
    steps:
      - action: utter_nombre_louv

  preguntar_proyecto_louv:
    description: |
      El usuario pregunta sobre el proyecto Louv, como "¿Qué es Louv?", 
      "¿Para qué sirve Louv?", "Háblame de Louv"
    steps:
      - action: utter_proyecto_louv





  # FLOWS SOBRE GEMAS DEL ZODIACO
  consultar_gema_zodiacal:
    description: |
      El usuario pregunta por la gema asociada a un signo zodiacal específico.
      El usuario puede mencionar directamente el signo (por ejemplo: "¿Cuál es la gema de Aries?",
      "Gema de Capricornio", "Soy Leo, ¿qué gema me corresponde?") o puede preguntar
      por su propia gema sin especificar el signo.
    steps:
      - collect: signo_zodiacal
        description: |
          El signo zodiacal del usuario. Valores permitidos: aries, tauro, geminis, 
          cancer, leo, virgo, libra, escorpio, sagitario, capricornio, acuario, piscis.
        next:
          - if: slots.signo_zodiacal == "aries"
            then:
              - action: utter_aries_granate
                next: END
          - if: slots.signo_zodiacal == "tauro"
            then:
              - action: utter_tauro_esmeralda
                next: END
          - if: slots.signo_zodiacal == "geminis"
            then:
              - action: utter_geminis_topacio
                next: END
          - if: slots.signo_zodiacal == "cancer"
            then:
              - action: utter_cancer_tanzanita
                next: END
          - if: slots.signo_zodiacal == "leo"
            then:
              - action: utter_leo_turmalina
                next: END
          - if: slots.signo_zodiacal == "virgo"
            then:
              - action: utter_virgo_opalo
                next: END
          - if: slots.signo_zodiacal == "libra"
            then:
              - action: utter_libra_amatista
                next: END
          - if: slots.signo_zodiacal == "escorpio"
            then:
              - action: utter_escorpio_peridoto
                next: END
          - if: slots.signo_zodiacal == "sagitario"
            then:
              - action: utter_sagitario_rubi
                next: END
          - if: slots.signo_zodiacal == "capricornio"
            then:
              - action: utter_capricornio_diamante
                next: END
          - if: slots.signo_zodiacal == "acuario"
            then:
              - action: utter_acuario_aguamarina
                next: END
          - if: slots.signo_zodiacal == "piscis"
            then:
              - action: utter_piscis_zafiro
                next: END
          - else:
              - action: utter_signo_no_reconocido
                next: END




  # FLOW SOBRE AYUDA CON GEMAS DEL ZODIACO

  preguntar_gema_zodiaco:
    description: |
      El usuario pregunta qué gema corresponde a su signo zodiacal sin especificar cuál es.
      Por ejemplo: "¿Qué gema es la mía?", "¿Cuál es mi gema?", "¿Qué gema me corresponde?",
      "Quiero saber qué gema corresponde a mi signo", "¿Cuál es la gema de mi signo?",
      "Gema por signo zodiacal", "¿Gema para mi signo zodiacal?"
      Este flow se activa cuando el usuario quiere información sobre su gema pero NO especifica el signo.
      NO SE MENCIONA NINGÚN SIGNO ZODIACAL EN LA ENTRADA DEL USUARIO, ni tampoco se hace una pregunta directa sobre un signo.
    always_include_in_prompt: true
    steps:
      - action: utter_ask_signo_zodiacal

  usuario_desconoce_signo_zodiaco:
    description: |
      El usuario no sabe cuál es su signo zodiacal. El usuario indica que no sabe su signo o su signo zodiacal.
    steps:
      - action: utter_signo_nacimiento



  #FLOW SOBRE USUARIO Y SU SIGNO ZODIACAL

determinar_signo_por_fecha:
  description: |
    El usuario proporciona su FECHA DE NACIMIENTO COMPLETA (día y mes) para que 
    se determine automáticamente su signo zodiacal. Por ejemplo: "nací el 20 de septiembre",
    "mi cumpleaños es 15/03", "20 de marzo". 
    Este flow NO debe activarse si el usuario solo menciona el nombre de un signo.
  steps:
    - collect: fecha_nacimiento
      description: |
        La fecha de nacimiento del usuario en formato día/mes (por ejemplo: 15/03, 25/07)
        o en texto natural como "20 de septiembre".
        Solo necesitamos el día y el mes, no el año.
    
    - id: determinar_signo
      action: action_determinar_signo_zodiacal
      next:
        - if: slots.signo_zodiacal == "aries"
          then:
            - action: utter_usuario_aries
              next: END
        - if: slots.signo_zodiacal == "tauro"
          then:
            - action: utter_usuario_tauro
              next: END
        - if: slots.signo_zodiacal == "geminis"
          then:
            - action: utter_usuario_geminis
              next: END
        - if: slots.signo_zodiacal == "cancer"
          then:
            - action: utter_usuario_cancer
              next: END
        - if: slots.signo_zodiacal == "leo"
          then:
            - action: utter_usuario_leo
              next: END
        - if: slots.signo_zodiacal == "virgo"
          then:
            - action: utter_usuario_virgo
              next: END
        - if: slots.signo_zodiacal == "libra"
          then:
            - action: utter_usuario_libra
              next: END
        - if: slots.signo_zodiacal == "escorpio"
          then:
            - action: utter_usuario_escorpio
              next: END
        - if: slots.signo_zodiacal == "sagitario"
          then:
            - action: utter_usuario_sagitario
              next: END
        - if: slots.signo_zodiacal == "capricornio"
          then:
            - action: utter_usuario_capricornio
              next: END
        - if: slots.signo_zodiacal == "acuario"
          then:
            - action: utter_usuario_acuario
              next: END
        - if: slots.signo_zodiacal == "piscis"
          then:
            - action: utter_usuario_piscis
              next: END
        - else:
            - action: utter_fecha_invalida
              next: END